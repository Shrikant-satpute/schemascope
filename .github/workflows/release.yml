name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # A hung step would otherwise hold the account's only Windows runner for the
    # 6 hour default, starving every other workflow behind it.
    timeout-minutes: 45

    # Lifted to the job so the signing steps can test it in an `if`. Secrets are
    # not readable from a step-level `if` directly. While the SignPath OSS
    # application is pending the secret is absent, every signing step skips, and
    # the release still goes out unsigned exactly as it does today.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version"

      - name: Test
        run: dotnet test -c Release

      - name: Build app
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.version.outputs.version }}

      # The app exe is signed *before* Inno packages it. Signing only the
      # installer would leave the binary that actually gets installed unsigned,
      # so SmartScreen would move its warning from install time to first launch
      # instead of removing it.
      - name: Upload app exe for signing
        id: upload-app
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: schemascope-exe-unsigned
          path: dist/SchemaScope.exe
          if-no-files-found: error

      - name: Sign app exe
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: schemascope
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          # Lands the signed exe back over the unsigned one, so the installer
          # step below picks it up with no path changes.
          output-artifact-directory: dist

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          # Present on the hosted images today, but a release that dies at the
          # packaging step is worse than one extra install.
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            installer\SchemaScope.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload installer for signing
        id: upload-installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: schemascope-setup-unsigned
          path: installer/Output/SchemaScope-Setup.exe
          if-no-files-found: error

      - name: Sign installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: schemascope
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/Output

      # Must stay after both signing steps: signing rewrites the files, so
      # hashes taken any earlier would not match what people download.
      - name: Publish checksums
        shell: pwsh
        run: |
          $files = @(
            'installer\Output\SchemaScope-Setup.exe',
            'dist\SchemaScope.exe'
          )
          Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: SchemaScope ${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            installer/Output/SchemaScope-Setup.exe
            dist/SchemaScope.exe
            SHA256SUMS.txt
          body: |
            ## Install

            Download **SchemaScope-Setup.exe** and run it. It installs for your
            account only, needs no administrator rights, and offers a desktop
            shortcut.

            Prefer nothing installed? **SchemaScope.exe** is the portable
            single-file build - download and double-click, no installer.

            ### Windows will warn you on first run

            These binaries are not code-signed yet, so SmartScreen shows
            *"Windows protected your PC"*. Click **More info** then **Run
            anyway**.

            You do not have to take that on trust: this release was built in
            public by GitHub Actions from the tagged commit, and `SHA256SUMS.txt`
            below lists the hashes. Verify with:

            ```powershell
            Get-FileHash .\SchemaScope-Setup.exe -Algorithm SHA256
            ```

            ### Requirements

            Windows 10 or 11. Nothing else - the .NET runtime is bundled and
            WebView2 already ships with Windows.
