name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One Windows runner at a time on this account, so a queued CI run just starves
# behind whatever else is building. Superseded runs are dropped instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore
        # Must match the configuration the build below uses. SchemaScope.Shell
        # only sets RuntimeIdentifier=win-x64 in Release, so a bare restore
        # evaluates as Debug, writes an assets file with no win-x64 target, and
        # the Release build then fails with NETSDK1047.
        run: dotnet restore -p:Configuration=Release

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build web
        working-directory: web
        run: npm run build

  # Docker-backed engine tests (MULTI-DATABASE-PLAN section 9). Linux, because Windows runners cannot run Linux
  # containers. Only the engine test project runs here; the Windows job above is unchanged and skips these tests.
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test engines
        env:
          SCHEMASCOPE_ENGINE_TESTS: '1'
        run: dotnet test tests/SchemaScope.Engines.Tests -c Release --verbosity normal
