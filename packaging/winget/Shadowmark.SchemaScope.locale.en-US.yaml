ShortDescription: Compare SQL Server database schemas across many targets at once.
Description: |-
  SchemaScope is a Windows desktop application for comparing SQL Server
  database schemas. It compares one source database against many target
  databases in a single pass and shows the differences per object, with the
  generating SQL side by side.

  It ships as a self-contained executable: no .NET runtime install and no
  server component. It reads database catalogs and never writes to them,
  sends no telemetry, and keeps database credentials on the local machine.

  Supports SQL Server 2012 and later, Azure SQL Database, Azure SQL Managed
  Instance and AWS RDS.
